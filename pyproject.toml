[project]
name = "oc-lode"
version = "2.1.0"
description = "New reengineered version of LODE, maintained by OpenCitations"
authors = [
    {name = "Valentina Pasqual", email = "valentina.pasqual2@unibo.it"},
    {name = "Ahmadreza Nazari"},
    {name = "Silvio Peroni", email = "silvio.peroni@unibo.it"},
]
readme = "README.md"
license = "ISC"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
keywords = ["owl", "ontology", "rdf", "skos", "documentation", "semantic-web", "opencitations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rdflib>=7.4.0",
    "jinja2>=3.1.2",
    "requests>=2.31.0",
    "minify-html>=0.18.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "gunicorn>=21.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
lode = "lode.cli:main"

[project.urls]
Homepage = "https://github.com/opencitations/lode"
Repository = "https://github.com/opencitations/lode"
Documentation = "https://opencitations.github.io/lode/"
Issues = "https://github.com/opencitations/lode/issues"

[dependency-groups]
dev = [
    "genbadge[coverage]>=1.1.3",
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lode"]

[tool.hatch.build.targets.sdist]
include = ["lode", "tests"]
