name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_run:
    workflows: ["Run tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage report
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: docs/coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download coverage badge
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: docs/coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install "jupyter-book>=2"

      # BASE_URL: the site lives under /lode/ on GitHub Pages
      - run: jupyter book build --html
        working-directory: docs
        env:
          BASE_URL: /lode

      # Jupyter Book does not copy files outside the toc: add the coverage report by hand
      - name: Add coverage report
        if: github.event_name == 'workflow_run'
        run: cp -r docs/coverage docs/_build/html/coverage

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
