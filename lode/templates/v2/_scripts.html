<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

{% if model.warnings %}
<div id="warning-toasts" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1100"></div>
<script>
    (function () {
        var MAX = 5;   // more than this would cover the page; the rest is in the server log
        var warnings = {{ model.warnings|tojson }};
        var box = document.getElementById("warning-toasts");

        function show(title, text) {
            var el = document.createElement("div");
            el.className = "toast text-bg-warning";
            el.setAttribute("role", "alert");
            el.innerHTML = '<div class="toast-header text-bg-warning"><strong class="me-auto"></strong>' +
                '<button type="button" class="btn-close" data-bs-dismiss="toast"></button></div>' +
                '<div class="toast-body"></div>';
            // textContent: messages carry IRIs from the ontology, never inject them as HTML
            el.querySelector("strong").textContent = title;
            el.querySelector(".toast-body").textContent = text;
            box.appendChild(el);
            el.addEventListener("hidden.bs.toast", function () { el.remove(); });
            new bootstrap.Toast(el, { delay: 8000 }).show();
        }

        warnings.slice(0, MAX).forEach(function (w) { show(w.code, w.message); });
        if (warnings.length > MAX) {
            show("warnings", "+" + (warnings.length - MAX) + " more, see the server log");
        }
    })();
</script>
{% endif %}

<script>
    document.addEventListener("DOMContentLoaded", function() {

        // Security hooks
        DOMPurify.addHook('afterSanitizeAttributes', function(node) {
            if (node.tagName === 'A') {
                node.setAttribute('target', '_blank');
                node.setAttribute('rel', 'noopener noreferrer');
            }
            if (node.tagName === 'IMG') {
                node.setAttribute('class', 'img-fluid border rounded mt-2 mb-2');
            }
        });

        marked.use({
            gfm: true,
            breaks: false // So line breaks not be added
        });

        const mdElements = document.querySelectorAll('.render-markdown');

        mdElements.forEach(function(el) {
            try {
                let rawText = el.dataset.md ?? el.textContent;

                // Strip only leading/trailing blank lines, keep the indentation of the others
                rawText = rawText.replace(/^([ \t]*\n)+/, '').replace(/(\n[ \t]*)+$/, '');
                // 2. Strip ANY XML namespace prefix (Turns <html:div> into <div>, </xhtml:p> into </p>)
                let cleanText = rawText.replace(/<(\/?)[a-zA-Z0-9_-]+:([a-zA-Z0-9]+)/gi, '<$1$2');

                // 3. Strip xmlns attributes
                cleanText = cleanText.replace(/ xmlns(:[a-zA-Z0-9_-]+)?="[^"]*"/gi, '');

                let rawHTML = "";

                // 4. Smart Routing
                if (el.tagName === 'SPAN' || el.tagName === 'A') {
                    rawHTML = marked.parseInline(cleanText);
                } else {
                    rawHTML = marked.parse(cleanText);
                }

                // 5. Sanitize
                const cleanHTML = DOMPurify.sanitize(rawHTML, {
                    ADD_TAGS: ['img'],
                    ADD_ATTR: ['target', 'src', 'alt', 'title', 'class']
                });

                el.innerHTML = cleanHTML;
            } catch (e) {
                console.error("Error rendering markdown/html:", e);
            }
        });
    });

    function toggleMetadataAccordion(event) {
        event.preventDefault();   // stop the native behaviour: its bubbling is inconsistent
        event.stopPropagation();  // avoid a double toggle if the summary catches the click too
        const details = event.currentTarget.closest('details.metadata-accordion');
        if (details) details.open = !details.open;
    }

    /* SEARCHBAR */
    (function () {
        const wrap = document.getElementById('toc-float-search');
        const toggle = document.getElementById('toc-float-search-toggle');
        const input = document.getElementById('toc-float-search-input');
        const countEl = document.getElementById('toc-float-search-count');
        const prevBtn = document.getElementById('toc-float-search-prev');
        const nextBtn = document.getElementById('toc-float-search-next');
        if (!wrap || !toggle || !input) return;

        const cards = Array.from(document.querySelectorAll('.container-fluid .card[id]'));
        let matches = [];
        let current = -1;

        function updateCount() {
            countEl.textContent = matches.length ? `${current + 1}/${matches.length}` : (input.value ? '0/0' : '');
        }

        function clearHighlight() {
            cards.forEach(c => c.classList.remove('toc-search-current'));
        }

        function goTo(index) {
            if (!matches.length) return;
            current = (index + matches.length) % matches.length;
            clearHighlight();
            const card = matches[current];
            card.classList.add('toc-search-current');
            card.scrollIntoView({ block: 'start' });
            updateCount();
        }

        function runSearch() {
            const q = input.value.trim().toLowerCase();
            clearHighlight();

            // Sidebar: dim + disable non-matching
            const sidebar = document.getElementById('toc-sidebar');
            if (sidebar) {
                sidebar.querySelectorAll('.toc-sidebar-section').forEach(section => {
                    let anyMatch = false;
                    section.querySelectorAll('.toc-sidebar-list li').forEach(li => {
                        const match = !q || li.textContent.toLowerCase().includes(q);
                        li.classList.toggle('toc-search-dim', !match);
                        if (match) anyMatch = true;
                    });
                    section.classList.toggle('toc-search-dim', q.length > 0 && !anyMatch);
                    if (q && anyMatch) section.open = true;
                });
            }

            if (!q) {
                matches = [];
                current = -1;
                updateCount();
                return;
            }
            matches = cards.filter(card => {
                const label = card.querySelector('.card-header h4')?.textContent.toLowerCase() || '';
                return label.includes(q);
            });
            current = -1;
            updateCount();
            if (matches.length) goTo(0);
        }

        toggle.addEventListener('click', function () {
            const open = wrap.classList.toggle('open');
            if (open) {
                input.focus();
            } else {
                input.value = '';
                runSearch();
            }
        });

        input.addEventListener('input', runSearch);

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.shiftKey) goTo(current - 1);
                else goTo(current + 1);
            }
        });

        prevBtn.addEventListener('click', () => goTo(current - 1));
        nextBtn.addEventListener('click', () => goTo(current + 1));
    })();
</script>
